name: 毎晩の数字集計
on:
  schedule:
    - cron: "3 13 * * *"   # 毎晩 22:03（日本時間）
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: crea-data, cancel-in-progress: false }
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m crea.report
      - name: 結果を保存
        run: |
          git config user.name "crea-bot"
          git config user.email "crea-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "auto: $GITHUB_WORKFLOW $(date +%F_%H%M)"
          git pull --rebase && git push
