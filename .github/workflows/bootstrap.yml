name: 初回セットアップ（展開）
on:
  push:
    paths: ["setup/payload.b64", ".github/workflows/bootstrap.yml"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: プログラム一式を展開
        run: |
          [ -f setup/payload.b64 ] || { echo "展開済み"; exit 0; }
          base64 -d setup/payload.b64 | tar -xz
          git rm -q setup/payload.b64
          git config user.name "crea-bot"
          git config user.email "crea-bot@users.noreply.github.com"
          git add -A
          git commit -m "setup: プログラム一式を展開"
          git push
