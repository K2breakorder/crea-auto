name: 毎週の投稿づくり
on:
  schedule:
    - cron: "17 9 * * 0"   # 毎週日曜 18:17（日本時間）
  workflow_dispatch:
    inputs:
      force: { description: "作り直す(1)", default: "0" }
permissions: { contents: write }
concurrency: { group: crea-data, cancel-in-progress: false }
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
      GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
      GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
      GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
      GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      FORCE: ${{ github.event.inputs.force || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 先週の反応を集める
        run: python -m crea.insights
        continue-on-error: true
      - name: 来週分を作る（最新情報の検索→作文→法規チェック→画像）
        run: python -m crea.generate
      - name: 結果を保存
        run: |
          git config user.name "crea-bot"
          git config user.email "crea-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "auto: $GITHUB_WORKFLOW $(date +%F_%H%M)"
          git pull --rebase && git push
