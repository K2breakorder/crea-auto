# ============================================================
#  Crea 集客自動化 設定ファイル
#  ここを書き換えるだけで、投稿の頻度・時間・媒体のON/OFFを変えられます
# ============================================================

clinic:
  name: "Crea athlete & beauty care"
  short_name: "Crea"
  address: "静岡県三島市一番町5-10 1-A"
  access: "JR三島駅南口 徒歩3分"
  hours: "9:00〜19:00（完全予約制・1対1）"
  phone: "090-1405-0838"
  parking: "玄関前に1台"
  payment: "現金・クレジットカード・QRコード決済"
  website: "https://crea-mishima.com/"
  hotpepper: "https://beauty.hotpepper.jp/kr/slnH000593103/"
  line_url: "https://lin.ee/p7LXrvJ"
  instagram: "@crea_mishima"
  ig_location_id: "2061850340697487"   # Instagram投稿に付ける場所タグ（CreaのFacebookページID）
  qualifications: "国家資格者（東洋医学・西洋医学の両方の国家資格）"  # 経歴（業界歴など）は広告ガイドライン上書かない
  concept: "病院や他の整体で原因がわからなかった40〜60代女性の慢性的な不調に、からだ全体から向き合う"
  target: "三島・沼津・長泉・清水町・裾野・伊豆の国に住む／通勤する40〜60代女性"
  menus:
    - "からだの根本ケア（東洋の叡智を取り入れた全身調整）"
    - "極上リラクゼーションマッサージ"
    - "美容ケア（肌・むくみ・表情）"
    - "アスリートケア（スポーツをする方のコンディショニング）"
  line_benefit: "LINE限定：カウンセリング長め＋ドリンクサービス"
  theme_color: "brown"

# 目標と戦略（毎週の投稿づくりでAIが必ず参照する）
strategy:
  goal: "三島市で『鍼灸・整体を探す人に最初に選ばれる院』になる（Googleマップ上位・口コミ評価と数・HPB予約数で地域トップ）"
  local_keywords: ["三島", "三島市", "三島駅", "三島駅南口", "長泉", "清水町", "沼津", "裾野", "伊豆の国"]
  search_phrases: ["三島 鍼灸", "三島 整体", "三島駅 整体", "三島 肩こり", "三島 腰痛", "三島 美容鍼", "三島 マッサージ", "三島 不調 相談"]
  strengths: ["東洋医学・西洋医学の両方の国家資格", "完全予約制・1対1", "三島駅南口 徒歩3分", "病院や他院で原因がわからなかった不調に全身から向き合う"]
  review_ask_ratio: 0.2      # 投稿の約2割で、来院された方へGoogle口コミのお願いを自然に入れる（特典との引き換えは禁止）
  competitor_watch: true     # 毎週、三島の上位院の動き（口コミ数・発信テーマ）を調べて差別化に使う

# 使うAI（Claude API）
ai:
  model: "claude-sonnet-5-5"        # 文章を作るモデル
  review_model: "claude-sonnet-5-5" # 法規チェックをするモデル
  web_search_tool: "web_search_20250305"
  max_searches: 8                   # 1回の生成で調べる最大回数（1回 約1.5円）

# 媒体ごとのON/OFFと頻度（曜日: mon tue wed thu fri sat sun / 時刻は日本時間）
channels:
  instagram:
    enabled: true
    slots: [{day: mon, time: "12:10"}, {day: wed, time: "12:10"}, {day: fri, time: "19:30"}]
  threads:
    enabled: true
    slots: [{day: mon, time: "8:30"}, {day: tue, time: "8:30"}, {day: wed, time: "8:30"},
            {day: thu, time: "8:30"}, {day: fri, time: "8:30"}, {day: sat, time: "8:30"},
            {day: sun, time: "8:30"}]   # 毎朝8:30
  gbp:            # Googleマップ（Googleビジネスプロフィール）
    enabled: true
    slots: [{day: tue, time: "10:00"}, {day: thu, time: "10:00"}, {day: sat, time: "9:00"}]  # MEO重視で週3本
  hpb_blog:       # ホットペッパーはAPIがないため、完成原稿をメールで届ける（貼り付け1分）
    enabled: true
    slots: [{day: mon, time: "8:00"}, {day: thu, time: "8:00"}]
  ameblo:         # アメブロはメール投稿が終了したため、HPBと同じテーマの完成原稿をメールで届ける
    enabled: true
    slots: [{day: mon, time: "8:05"}, {day: thu, time: "8:05"}]
  line_broadcast: # LINE一斉配信（無料プランは月200通。残り通数を確認してから送る）
    enabled: true
    weeks_of_month: [1]       # 第1週だけ配信（友だち数が増えたら [1,3] などに）
    slot: {day: thu, time: "12:00"}

# 安全装置
safety:
  hold_on_any_ng: true      # NG表現が1つでも残ったら投稿せず保留にしてメールで知らせる
  max_posts_per_day: 8      # 万一の暴走防止
